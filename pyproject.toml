[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wedding-ops"
version = "0.1.0"
description = "Human-led, role-aware wedding-day operations with optional model-assisted intent parsing"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "SQLAlchemy==2.0.50",
  "httpx==0.28.1",
  "alembic==1.18.4",
  "python-multipart==0.0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.4"]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0"]

[project.scripts]
weddingops = "wedding_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["wedding_ops"]
omit = ["*/cli.py"]

[tool.coverage.report]
show_missing = true
